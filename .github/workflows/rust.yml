name: rust
on:
  push:
    paths: ["methods/report-codes/rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["methods/report-codes/rust/**"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: methods/report-codes/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: core only (no dependencies)
        run: cargo test --no-default-features
      - name: all features
        run: cargo test --features cli
  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: methods/report-codes/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: the core and QR build for WebAssembly
        run: cargo build --target wasm32-unknown-unknown --features qr
